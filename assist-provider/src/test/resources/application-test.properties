spring.datasource.url=jdbc:h2:mem:ns3_assist_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=registration

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=0
server.servlet.context-path=/assist-provider
server.ssl.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

assist.registration.document-storage.path=./build/test-registration-documents
assist.base.document-storage.path=./build/test-base-documents
