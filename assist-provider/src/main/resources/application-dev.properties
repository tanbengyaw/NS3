# Dev profile: file-backed H2 (no PostgreSQL required). AUTO_SERVER lets DBeaver attach while the app runs.
# Do NOT use DATABASE_TO_LOWER here - it breaks Liquibase changelog table detection on H2.
spring.datasource.url=jdbc:h2:file:./data/ns3_assist;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.liquibase.database-change-log-table=databasechangelog
spring.liquibase.database-change-log-lock-table=databasechangeloglock
# Browser H2 console breaks with server.servlet.context-path=/assist-provider - use DBeaver instead (see README).
spring.h2.console.enabled=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Swagger UI (SpringDoc) loads the Jersey-generated OpenAPI spec
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.url=/api/openapi.json
springdoc.swagger-ui.disable-swagger-default-url=true

server.port=8081
server.ssl.enabled=false

assist.registration.document-storage.path=./data/registration-documents
assist.base.document-storage.path=./data/base-documents

# Optional: folder with legacy letter images (national_emblem.png, sst_kastam_logo.png)
# registration.letter.assets-path=C:/development/pdf_template/images
